name: 'Sparkle Validator'
description: 'Validate Sparkle appcast.xml feeds for errors, warnings, and best practices'
author: 'David E. Weekly'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  file:
    description: 'Path to appcast.xml file or URL to validate'
    required: true
  strict:
    description: 'Treat warnings as errors (exit code 1 if any warnings)'
    required: false
    default: 'false'
  check-urls:
    description: 'Verify that enclosure URLs exist and sizes match'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout for URL checks in milliseconds'
    required: false
    default: '10000'
  quiet:
    description: 'Only show errors (suppress warnings and info)'
    required: false
    default: 'false'
  no-info:
    description: 'Suppress informational messages'
    required: false
    default: 'false'
  format:
    description: 'Output format: text or json'
    required: false
    default: 'text'
  base-url:
    description: 'Base URL for resolving relative links'
    required: false
  require-signed-feed:
    description: 'Require valid Ed25519 signatures for enclosures and release notes'
    required: false
    default: 'false'
  target-sparkle-version:
    description: 'Target Sparkle version bundled in update (e.g. 2.10.0 or 300=2.10.0)'
    required: false

outputs:
  valid:
    description: 'Whether the appcast is valid (true/false)'
    value: ${{ steps.validate.outputs.valid }}
  error-count:
    description: 'Number of errors found'
    value: ${{ steps.validate.outputs.error_count }}
  warning-count:
    description: 'Number of warnings found'
    value: ${{ steps.validate.outputs.warning_count }}
  info-count:
    description: 'Number of informational messages'
    value: ${{ steps.validate.outputs.info_count }}
  json:
    description: 'Full validation result as JSON (when format=json)'
    value: ${{ steps.validate.outputs.json }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Validate appcast
      id: validate
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_CHECK_URLS: ${{ inputs.check-urls }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_QUIET: ${{ inputs.quiet }}
        INPUT_NO_INFO: ${{ inputs.no-info }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_REQUIRE_SIGNED_FEED: ${{ inputs.require-signed-feed }}
        INPUT_TARGET_SPARKLE_VERSION: ${{ inputs.target-sparkle-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "${ACTION_PATH:-.}/scripts/run-action.mjs"
